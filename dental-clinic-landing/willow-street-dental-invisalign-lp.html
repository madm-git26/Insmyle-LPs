to Straighten Teeth`,body:`Clear aligners are designed to be virtually invisible when worn, so they tend to blend in with your natural smile. Many patients like that they can work toward their smile goals without the more noticeable look of metal brackets and wires.`},{title:`Comfortable,
Custom-Fitted Trays`,body:`Because each set of aligners is custom-made for your teeth, they are designed to fit closely and comfortably. As with any new dental appliance, it can take a little time to adjust to wearing a new set.`},{title:`Removable for
Eating and Drinking`,body:`Clear aligners can be taken out, so you are not restricted from the foods you enjoy the way you might be with fixed braces. Most patients remove them to eat and to drink anything other than water.`},{title:`Easier
Oral Hygiene`,body:`Because clear aligners come out, brushing and flossing can be more straightforward than navigating around brackets and wires. Removing your aligners for regular oral care can help you keep up with your normal routine.`},{title:`A Personalized
Treatment Plan`,body:`Your clear aligner plan is built around your own teeth and smile goals. Digital scans and imaging are used to map out how your teeth may move over the course of treatment, so your plan is designed specifically for you.`},{title:`A Convenient Path to
Exploring Your Options`,body:`You do not have to commit to anything to start learning more. A consultation — including a free virtual consultation — gives you a low-pressure way to ask questions and find out whether clear aligners may be a good fit.`}],w=[{title:`Local Care in Chippewa Falls`,body:`Willow Street Dental is located at 123 W. Willow Street, Chippewa Falls, WI 54729, offering dental care to patients throughout the local community.`},{title:`The Dental Team`,body:`Care is led by Dr. Curtis Calder, D.D.S., supported by a team that includes experienced staff such as dental hygienist Gena, who has been part of the team for 16 years.`},{title:`Doctor Education`,body:`Dr. Calder earned his Doctor of Dental Surgery degree from Creighton University School of Dentistry.`},{title:`Personalized Recommendations`,body:`Rather than a one-size-fits-all approach, treatment recommendations are based on your own dental exam and digital scans, so any plan discussed with you is specific to your smile and goals.`},{title:`Communication and Comfort`,body:`Dr. Calder describes his approach as combining modern dental technology with “a personal, down-to-earth approach,” with the goal of helping each patient feel comfortable in the dental chair.`},{title:`Virtual Consultation Convenience`,body:`For patients who want to start exploring their options before visiting the office, Willow Street Dental offers a free virtual consultation that begins with a photo of your smile.`}],ie=[{num:`01`,title:`Request a
Consultation`,body:`Request a free virtual consultation from home by submitting a photo of your smile, or call our Chippewa Falls office directly.`},{num:`02`,title:`Discuss Your
Smile Goals`,body:`Let our team know what you would like to change about your smile. We follow up to schedule your personalized next step.`},{num:`03`,title:`Complete an

Personalized Plan`,body:`If clear aligners are a good fit, digital imaging helps map out a step-by-step plan. Your timeline and next steps are discussed with you directly.`}],ae=[`Crowded teeth`,`Spacing between teeth`,`Overbites, underbites, or crossbites`,`Minor tooth rotations`],oe=[{initials:`CC`,photo:m,name:`Dr. Curtis Calder, D.D.S.`,body:`Dr. Curtis Calder earned his Doctor of Dental Surgery degree from Creighton University School of Dentistry. He offers a full range of dental care at Willow Street Dental — from everyday needs like cleanings, fillings, and crowns to more advanced procedures such as root canal therapy, dental implants, and smile makeovers.`,quote:`“My goal is always the same: to help each patient feel confident in their smile and comfortable in the dental chair. My team and I are committed to treating every patient like family.”`,note:`[INSERT VERIFIED INFORMATION for any additional credentials, specialty training, or professional memberships]`},{initials:`G`,photo:null,name:`Gena — Dental Hygienist`,body:`Gena has been part of the Willow Street Dental team for 16 years. She attended the University of Minnesota for dental hygiene and graduated in 1982, bringing years of hands-on experience to every patient visit.`,quote:null,note:null}],se=[{quote:`“…best dental office I’ve ever visited. Doctor is incredibly knowledgeable and gentle…”`,name:`Jason R.`},{quote:`“…amazing experience…exceptional care…”`,name:`Sarah M.`},{quote:`“…exceeded all expectations…best dental care I’ve received…”`,name:`Emily C.`}],ce=[`The complexity of your treatment`,`Estimated treatment length`,`The type of aligner treatment recommended`,`Your existing dental needs`,`Your insurance benefits`,`Available payment or financing options`],le=[{q:`What are clear aligners?`,a:`Clear aligners are transparent, custom-made trays that fit over your teeth and are designed to gradually guide them into a straighter position, offering an alternative to traditional metal braces.`},{q:`Is Invisalign available in Chippewa Falls?`,a:`Many patients searching for Invisalign in Chippewa Falls are really looking for a discreet way to straighten their smile. Willow Street Dental offers clear aligner treatment in Chippewa Falls, WI, and our team can talk with you about your specific options during a consultation.`},{q:`Am I a candidate for clear aligners?`,a:`Clear aligners may help with mild to moderate concerns such as crowded or spaced teeth and certain bite issues, depending on your evaluation. An in-person or virtual consultation is needed to determine whether clear aligners are right for you.`},{q:`How long does clear aligner treatment take?`,a:`Treatment length varies by patient. Most patients complete clear aligner treatment in about 6 to 18 months, though your specific timeline will be discussed as part of your evaluation.`},{q:`Are clear aligners comfortable?`,a:`Clear aligners are custom-made to fit closely over your teeth. As with any orthodontic treatment, you may notice a short adjustment period with each new set. Our team can walk you through what to expect.`},{q:`Can I remove clear aligners to eat and brush?`,a:`Yes. Clear aligners are removable, so you can take them out to eat, to drink anything other than water, and to brush and floss. Most patients wear their aligners for about 20 to 22 hours a day to stay on track with their plan.`},{q:`How does the virtual consultation work?`,a:`You submit a photo of your smile and let us know what you would like to change. Our team then follows up to schedule your personalized virtual consultation. This option is free.`},{q:`How much do clear aligners cost?`,a:`Cost depends on factors like treatment complexity, length, and your individual dental needs. Ask the Willow Street Dental team about current fees, insurance benefits, and available payment options.`}];function ue(){let[e,t]=(0,l.useState)(()=>window.matchMedia(`(max-width: 767px)`).matches);return(0,l.useEffect)(()=>{let e=window.matchMedia(
