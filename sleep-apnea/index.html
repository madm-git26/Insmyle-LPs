<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Title and description mirror copy deck sections 24 and 25. The token
         versions live in src/content/copy.js; these are the rendered defaults. -->
    <title>Sleep Apnea Treatment in Springfield, ST | Restore Sleep &amp; Wellness</title>
    <meta
      name="description"
      content="Looking for sleep apnea treatment in Springfield? Explore personalized sleep apnea evaluations and oral appliance therapy options at Restore Sleep &amp; Wellness."
    />

    <!-- Fonts: preconnect + a single subsetted request (spec 33) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- LCP: the hero image is the largest paint, so it is preloaded -->
    <link rel="preload" as="image" href="/images/hero-restful-sleep.jpg" fetchpriority="high" />

    <meta name="theme-color" content="#123C7A" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
